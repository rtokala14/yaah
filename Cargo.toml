[workspace]
resolver = "2"
members = [
  "crates/harness-core",
  "crates/harness-git",
  "crates/harness-index",
  "crates/blurb-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
regex = "1"
ignore = "0.4"
globset = "0.4"
ureq = { version = "2", features = ["json"] }
crossbeam-channel = "0.5"
git2 = "0.20"
dirs = "6"
toml = "0.8"
log = "0.4"

# UI. gpui + gpui_platform MUST be pinned to the same zed revision that
# gpui-component's Cargo.lock pins (rev below matches gpui-component main
# @ v0.5.2, gpui 0.2.2). Verify against gpui-component's lockfile when
# bumping either dep — mismatched revs do not compile together.
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "cc053a4a6fa2fd0e8793201ed9099466af1be0b1" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "cc053a4a6fa2fd0e8793201ed9099466af1be0b1", features = ["font-kit", "x11", "wayland"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component.git" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component.git" }
smol = "2"

[profile.dev]
# gpui is heavy; keep dev builds usable
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
resolver = "2"
members = [
  "crates/harness-core",
  "crates/harness-git",
  "crates/harness-index",
  "crates/blurb-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
regex = "1"
ignore = "0.4"
globset = "0.4"
ureq = { version = "2", features = ["json"] }
crossbeam-channel = "0.5"
git2 = "0.20"
dirs = "6"
toml = "0.8"
log = "0.4"

# UI. gpui-component is pinned to an exact rev. All gpui crates use the
# same unversioned zed URL gpui-component itself uses, so the whole graph
# shares ONE zed source (no duplicate gpui packages); the exact zed commit
# is pinned in Cargo.lock (committed) via
#   cargo update -p gpui --precise <rev>
# where <rev> is what the pinned gpui-component's own Cargo.lock pins.
# When bumping gpui-component: update its rev here, read the new zed rev
# from its Cargo.lock, re-run the precise update, commit Cargo.lock.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component.git", rev = "1c4e681315052fc38a881a3b5b6f9df12934ba3c" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component.git", rev = "1c4e681315052fc38a881a3b5b6f9df12934ba3c" }
smol = "2"

[profile.dev]
# gpui is heavy; keep dev builds usable
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

